spring.application.name=inventory-service

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.inventoryservice.dto.OrderEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.inventoryservice.dto

app.kafka.topics.order-events=order-events
app.kafka.topics.order-events-dlt=order-events.DLT
app.kafka.topics.inventory-result=inventory-result
app.kafka.retry.max-attempts=6
app.kafka.retry.backoff-ms=1000

app.inventory.available-threshold=5

spring.datasource.url=jdbc:postgresql://localhost:5432/inventorydb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
